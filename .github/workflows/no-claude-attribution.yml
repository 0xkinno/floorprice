name: Block Claude attribution
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  no-claude-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Claude authors and trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          base, head = os.environ.get("BASE_SHA", ""), os.environ["HEAD_SHA"]
          rng = head if (not base or set(base) == {"0"}) else f"{base}..{head}"
          shas = subprocess.check_output(["git", "rev-list", rng], text=True).split()
          bad = False
          for sha in shas:
              raw = subprocess.check_output(["git", "show", "-s", "--format=%an%n%ae%n%cn%n%ce%n%B", sha],
                                            text=True, errors="replace")
              parts = raw.split("\n", 4)
              if len(parts) < 5:
                  continue
              ident, msg = " ".join(parts[:4]), parts[4]
              if re.search(r"claude|anthropic", ident, re.I) or re.search(
                  r"(?im)^\s*(co-authored-by:.*(claude|anthropic)|claude-session:|.*generated with.*claude code)", msg):
                  print(f"FAIL: {sha} has Claude/Anthropic identity or attribution."); bad = True
          if bad:
              sys.exit(1)
          print(f"PASS: {len(shas)} commits checked, no Claude attribution.")
          PY
